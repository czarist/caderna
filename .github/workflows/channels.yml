name: Channel builds
# One installable build per branch of the Caderna brand, each a program of its
# own (KG_CHANNEL): main is production (https://caderna.ia.br), hom is
# homologation (https://hom.caderna.ia.br), dev is development
# (http://localhost:8080). Each run replaces that channel's download, a
# release tagged latest-<channel>. Production is published only once the
# brand's legal and commercial review is done (`metadata release-ready`).
on:
  # Run by hand only (Actions tab or `gh workflow run channels.yml --ref <branch>`):
  # every push used up the account's Actions minutes. Releases come from a
  # `v*` tag (packages.yml).
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: channel-${{ github.ref_name }}
  cancel-in-progress: true
env:
  KG_BRAND_DIR: branding/caderna
  KG_CHANNEL: ${{ github.ref_name == 'main' && 'prod' || github.ref_name }}
  # Debug info and incremental caches fill the runner's disk.
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
jobs:
  # Each build uploads its files to a draft release instead of workflow
  # artifacts, so publishing downloads nothing and stays off the account's
  # artifact egress limit. The draft replaces the channel's download at the end.
  prepare:
    if: contains(fromJSON('["main", "hom", "dev"]'), github.ref_name)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      draft: ${{ steps.draft.outputs.draft }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: latest-${{ github.ref_name == 'main' && 'prod' || github.ref_name }}
    steps:
      - name: Draft release
        id: draft
        run: |
          # Drafts left by cancelled or failed runs of this channel.
          gh release list --limit 100 --json tagName,isDraft \
            --jq ".[] | select(.isDraft and (.tagName | startswith(\"$TAG-run\"))) | .tagName" \
            | while read -r old; do gh release delete "$old" --yes; done
          draft="$TAG-run$GITHUB_RUN_ID"
          gh release create "$draft" --draft --target "$GITHUB_SHA" --title "$draft" --notes "$draft"
          echo "draft=$draft" >> "$GITHUB_OUTPUT"

  package:
    needs: prepare
    permissions:
      contents: write
    outputs:
      data_dir: ${{ steps.brand.outputs.data_dir }}
      name: ${{ steps.brand.outputs.name }}
      version: ${{ steps.brand.outputs.version }}
      ready: ${{ steps.brand.outputs.ready }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    # A stuck build (network, hung test) stops here instead of the 6-hour default.
    timeout-minutes: 120
    steps:
      - name: Free disk space
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Rust
        shell: bash
        run: rustup update stable --no-self-update && rustup default stable
      - name: Channel metadata
        id: brand
        shell: bash
        run: |
          cargo build -p kg-brand --example metadata
          meta=target/debug/examples/metadata
          [[ -f "$meta.exe" ]] && meta="$meta.exe"
          echo "data_dir=$("$meta" data_dir)" >> "$GITHUB_OUTPUT"
          echo "name=$("$meta" name)" >> "$GITHUB_OUTPUT"
          echo "version=$(sed -nE 's/^version = "([0-9.]+)"/\1/p' Cargo.toml | head -n 1)" >> "$GITHUB_OUTPUT"
          if [[ "$KG_CHANNEL" != prod ]] || "$meta" release-ready; then
            echo "ready=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Production is built but not published until the brand's legal and commercial review is done ([legal] reviewed and commercial_reviewed)."
            echo "ready=no" >> "$GITHUB_OUTPUT"
          fi
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get -o Acquire::Retries=3 update && sudo apt-get -o Acquire::Retries=3 install -y libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev libegl1-mesa-dev libvulkan-dev glslc glslang-tools spirv-headers pkg-config
      - name: Windows Vulkan SDK
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install vulkan-sdk --version=1.4.363 -y --no-progress
      - name: Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package.ps1 -Brand $env:KG_BRAND_DIR
      - name: Unix package
        if: runner.os != 'Windows'
        run: bash scripts/package-unix.sh "$KG_BRAND_DIR"
      - name: Upload to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DRAFT: ${{ needs.prepare.outputs.draft }}
        run: |
          mkdir out
          for file in dist/*.zip dist/*.exe dist/*.tar.gz; do
            [[ -f "$file" ]] || continue
            cp "$file" "out/$(basename "$file" | sed -E 's/-[0-9]+\.[0-9]+\.[0-9]+//')"
          done
          cd out
          ls
          if command -v sha256sum > /dev/null; then sha256sum -- *; else shasum -a 256 -- *; fi | sed -E 's/ \*/  /' > "../SHA256-$RUNNER_OS.part"
          gh release upload "$DRAFT" -- * "../SHA256-$RUNNER_OS.part" --clobber
      # The panel's "Versões do app" (CADERNA-DASHBOARD) keeps the same files for /baixar and
      # the client area. Runs only where the panel is online: set the repository variable
      # PANEL_URL (e.g. https://hom.caderna.ia.br) and the secret RELEASES_UPLOAD_TOKEN.
      - name: Send the build to the panel
        if: vars.PANEL_URL != '' && steps.brand.outputs.ready == 'yes'
        shell: bash
        env:
          PANEL_URL: ${{ vars.PANEL_URL }}
          UPLOAD_TOKEN: ${{ secrets.RELEASES_UPLOAD_TOKEN }}
          VERSION: ${{ steps.brand.outputs.version }}
        run: |
          test -n "$UPLOAD_TOKEN" && test -n "$VERSION"
          case "$GITHUB_REF_NAME" in main) channel=production ;; hom) channel=hom ;; *) channel=dev ;; esac
          for file in out/*; do
            curl -fsS -X PUT --data-binary "@$file" -H "Content-Type: application/octet-stream" -H "Authorization: Bearer $UPLOAD_TOKEN" "$PANEL_URL/api/releases/$channel/$VERSION/files/$(basename "$file")"
            echo
          done

  release:
    needs: [prepare, package]
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      DATA_DIR: ${{ needs.package.outputs.data_dir }}
      NAME: ${{ needs.package.outputs.name }}
      VERSION: ${{ needs.package.outputs.version }}
      DRAFT: ${{ needs.prepare.outputs.draft }}
      TAG: latest-${{ github.ref_name == 'main' && 'prod' || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Drop the draft of a failed or unreviewed build
        if: needs.package.result != 'success' || needs.package.outputs.ready != 'yes'
        run: gh release delete "$DRAFT" --yes
      - name: Replace the channel's download
        if: needs.package.result == 'success' && needs.package.outputs.ready == 'yes'
        run: |
          gh release download "$DRAFT" --pattern 'SHA256-*.part' --dir parts
          cat parts/*.part | sort -k 2 > SHA256SUMS.txt
          cat SHA256SUMS.txt
          for required in "$DATA_DIR-setup.exe" "$DATA_DIR-windows-x64.zip" "$DATA_DIR-linux-x86_64.tar.gz" "$DATA_DIR-macos-arm64.tar.gz"; do
            grep -q "  $required\$" SHA256SUMS.txt
          done
          gh release upload "$DRAFT" SHA256SUMS.txt --clobber
          for part in parts/*.part; do
            gh release delete-asset "$DRAFT" "$(basename "$part")" --yes
          done
          short="${GITHUB_SHA::7}"
          notes="$NAME built from $GITHUB_REF_NAME at $short. Install $DATA_DIR-setup.exe on Windows; it installs apart from the other channels."
          kind=(--prerelease)
          [[ "$GITHUB_REF_NAME" == main ]] && kind=(--prerelease=false --latest)
          gh release delete "$TAG" --cleanup-tag --yes || true
          gh release edit "$DRAFT" --tag "$TAG" --target "$GITHUB_SHA" --title "$NAME ($short)" \
            --notes "$notes" --draft=false "${kind[@]}"
      - name: Publish the build on the panel
        if: vars.PANEL_URL != '' && needs.package.result == 'success' && needs.package.outputs.ready == 'yes'
        env:
          PANEL_URL: ${{ vars.PANEL_URL }}
          UPLOAD_TOKEN: ${{ secrets.RELEASES_UPLOAD_TOKEN }}
        run: |
          case "$GITHUB_REF_NAME" in main) channel=production ;; hom) channel=hom ;; *) channel=dev ;; esac
          gh release download "$TAG" --pattern SHA256SUMS.txt
          curl -fsS -X PUT --data-binary "@SHA256SUMS.txt" -H "Content-Type: application/octet-stream" -H "Authorization: Bearer $UPLOAD_TOKEN" "$PANEL_URL/api/releases/$channel/$VERSION/files/SHA256SUMS.txt"
          curl -fsS -X POST -H "Accept: application/json" -H "Authorization: Bearer $UPLOAD_TOKEN" "$PANEL_URL/api/releases/$channel/$VERSION/publish"
