name: Native packages
on:
  workflow_dispatch:
    inputs:
      brand:
        description: Brand folder (including branding/private/client)
        default: branding/caderna
        required: true
      private_brand_repository:
        description: Optional private owner/repository, checked out under branding/private
        required: false
      publish:
        description: Publish a reviewed, signed client release
        type: boolean
        default: false
      target_repository:
        description: Must match the brand updates.repository (owner/repository)
        required: false
      release_tag:
        description: Existing tag in the destination repository
        required: false
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: packages-${{ github.ref }}-${{ inputs.brand || 'default' }}
  cancel-in-progress: false
env:
  KG_BRAND_DIR: ${{ inputs.brand || 'branding/default' }}
  KG_COMMERCIAL: ${{ inputs.publish && '1' || '0' }}
jobs:
  package:
    outputs:
      data_dir: ${{ steps.brand.outputs.data_dir }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: inputs.private_brand_repository != ''
        with:
          repository: ${{ inputs.private_brand_repository }}
          token: ${{ secrets.BRAND_READ_TOKEN }}
          path: branding/private
          persist-credentials: false
      - name: Install Rust
        shell: bash
        run: rustup update stable --no-self-update && rustup default stable
      - name: Validate brand and release target
        id: brand
        shell: bash
        env:
          RELEASE_REPO: ${{ inputs.target_repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          [[ "$KG_BRAND_DIR" =~ ^branding/[a-zA-Z0-9_/-]+$ ]] || exit 1
          cargo build -p kg-brand --example metadata
          meta=target/debug/examples/metadata
          [[ -f "$meta.exe" ]] && meta="$meta.exe"
          echo "data_dir=$("$meta" data_dir)" >> "$GITHUB_OUTPUT"
          if [[ "$KG_COMMERCIAL" == 1 ]]; then
            "$meta" release-ready
            [[ "$RELEASE_REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || exit 1
            [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
            [[ "$("$meta" repository)" == "https://github.com/$RELEASE_REPO" ]] || exit 1
          fi
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev libegl1-mesa-dev libvulkan-dev glslc glslang-tools spirv-headers pkg-config
      - name: Windows Vulkan SDK
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install vulkan-sdk --version=1.4.363 -y --no-progress
      - name: Format and lints
        shell: bash
        run: |
          rustup component add rustfmt clippy
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Verify
        run: cargo test --locked --workspace
      - name: Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Import Windows signing certificate
        if: runner.os == 'Windows' && inputs.publish
        shell: pwsh
        env:
          KG_CERT_PFX_B64: ${{ secrets.KG_CERT_PFX_B64 }}
          KG_CERT_PASSWORD: ${{ secrets.KG_CERT_PASSWORD }}
        run: ./scripts/ci-signing-windows.ps1
      - name: Import Apple signing certificate
        if: runner.os == 'macOS' && inputs.publish
        env:
          KG_CERT_P12_B64: ${{ secrets.KG_CERT_P12_B64 }}
          KG_CERT_PASSWORD: ${{ secrets.KG_APPLE_CERT_PASSWORD }}
          KG_APPLE_ID: ${{ secrets.KG_APPLE_ID }}
          KG_APPLE_TEAM: ${{ secrets.KG_APPLE_TEAM }}
          KG_APPLE_PASSWORD: ${{ secrets.KG_APPLE_PASSWORD }}
        run: bash scripts/ci-signing-macos.sh
      - name: Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          KG_SIGN_TIMESTAMP: ${{ vars.KG_SIGN_TIMESTAMP }}
        run: ./scripts/package.ps1 -Brand $env:KG_BRAND_DIR -Commercial:($env:KG_COMMERCIAL -eq '1')
      - name: Unix package
        if: runner.os != 'Windows'
        env:
          KG_SIGN_IDENTITY: ${{ secrets.KG_SIGN_IDENTITY }}
        run: bash scripts/package-unix.sh "$KG_BRAND_DIR"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ steps.brand.outputs.data_dir }}-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/*.zip
            dist/*.exe
            dist/*.tar.gz
          if-no-files-found: error

  # Publication is explicit, uses the brand repository, and requires reviewed inputs.
  release:
    needs: package
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    environment: client-release
    env:
      DATA_DIR: ${{ needs.package.outputs.data_dir }}
      RELEASE_REPO: ${{ inputs.target_repository }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: artifacts
      - name: Assets with fixed names
        run: |
          mkdir release
          find artifacts -type f | while read -r file; do
            name="$(basename "$file" | sed -E 's/-[0-9]+\.[0-9]+\.[0-9]+//')"
            cp "$file" "release/$name"
          done
          ls release
          for required in "$DATA_DIR-setup.exe" "$DATA_DIR-windows-x64.zip" \
              "$DATA_DIR-linux-x86_64.tar.gz" "$DATA_DIR-macos-arm64.tar.gz"; do
            test -f "release/$required"
          done
          (cd release && sha256sum * > SHA256SUMS.txt)
      - name: Release notes from the changelog
        run: |
          version="${RELEASE_TAG#v}"
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || echo "$DATA_DIR $RELEASE_TAG" > notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.CLIENT_RELEASE_TOKEN }}
        run: gh release create "$RELEASE_TAG" release/* --repo "$RELEASE_REPO" --title "$DATA_DIR $RELEASE_TAG" --notes-file notes.md --verify-tag
