[package]
name = "kg-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
kg-brand.workspace = true
chrono.workspace = true
eframe.workspace = true
egui.workspace = true
egui_extras = { version = "0.36", default-features = false, features = ["svg", "image"] }
image.workspace = true
kg-engine.workspace = true
resvg = "0.47"
rfd.workspace = true
rust-i18n.workspace = true
tracing.workspace = true
tray-icon.workspace = true
# The main window's handle, to keep it out of screen captures (capture.rs).
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
# The window's sharing type, to keep it out of screen captures (capture.rs).
objc2-app-kit = { version = "0.3", features = ["NSResponder", "NSView", "NSWindow"] }

[dev-dependencies]
kg-engine = { workspace = true, features = ["test-support"] }
egui_kittest = { version = "0.36", features = ["eframe", "wgpu", "snapshot"] }
kg-study.workspace = true
tempfile.workspace = true

[lints]
workspace = true

[features]
cuda = ["kg-engine/cuda"]
